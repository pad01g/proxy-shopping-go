[profile.default]
src = "src"
test = "test"
script = "script"
out = "out"
libs = ["lib"]
solc_version = "0.8.28"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
# CREATE2 のアドレスをどの環境でも同じにするため、メタデータのハッシュを埋め込まない。
bytecode_hash = "none"
cbor_metadata = false
fs_permissions = [{ access = "read-write", path = "./deployments" }]

remappings = [
  "forge-std/=lib/forge-std/src/",
  "@safe/=lib/safe-smart-account/contracts/",
]

[fmt]
line_length = 120

[lint]
# ERC-20 / AggregatorV3 の名前（name, decimals など）は規格どおりにする。
lint_on_build = false
