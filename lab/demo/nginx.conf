# The lab's demo server (compose service `demo`, http://localhost:8888/). Lab only: it serves the demo page and
# puts everything the page needs behind one origin — the Nostr relays, Esplora, the EVM RPC, the faucet, the rate
# mock and the shopper nodes' admin API WITH ITS TOKEN. Anyone who can open this port can mine, warp time, pause
# the shopper nodes and change rates. It is published on 127.0.0.1 only; never expose it (docs/lab.md「デモ画面」).
map $http_upgrade $connection_upgrade {
  default upgrade;
  '' close;
}

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  server_tokens off;
  resolver 127.0.0.11 valid=10s ipv6=off;

  # Same security headers as the public app, with websockets to this host allowed.
  set $csp "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' ws://$http_host wss://$http_host; object-src 'none'; base-uri 'none'; frame-ancestors 'none'; form-action 'self'";
  add_header Content-Security-Policy $csp always;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy no-referrer always;

  proxy_http_version 1.1;
  proxy_buffering off;
  # Mining many blocks at once (T2 in the timelock scenario) takes minutes.
  proxy_read_timeout 10m;

  location = /demo-config.json {
    add_header Cache-Control "no-store" always;
    add_header Content-Security-Policy $csp always;
    alias /etc/demo/demo-config.json;
  }

  location /deployments/ {
    add_header Cache-Control "no-store" always;
    add_header Content-Security-Policy $csp always;
    alias /deployments/;
  }

  # Nostr relays (websocket). The relays trust this server's X-Forwarded-For (-trusted-proxies in compose.yaml).
  location = /relay-1 {
    set $up relay-1:7777;
    proxy_pass http://$up/;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host relay-1.test;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_read_timeout 1h;
    proxy_send_timeout 1h;
  }
  location = /relay-2 {
    set $up relay-2:7777;
    proxy_pass http://$up/;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host relay-2.test;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_read_timeout 1h;
    proxy_send_timeout 1h;
  }

  location /esplora/ {
    set $up esplora:3000;
    rewrite ^/esplora/(.*)$ /$1 break;
    proxy_pass http://$up;
  }

  location = /evm {
    set $up anvil:8545;
    proxy_pass http://$up/;
  }

  location /faucet/ {
    set $up faucet:8080;
    rewrite ^/faucet/(.*)$ /$1 break;
    proxy_pass http://$up;
  }

  # The rate mock answers by Host (rates.test); its admin API wants the lab token.
  location /rates/ {
    set $up fakeshop:8080;
    rewrite ^/rates/(.*)$ /$1 break;
    proxy_pass http://$up;
    proxy_set_header Host rates.test;
    proxy_set_header X-Admin-Token lab;
  }

  # psnode admin API of the shopper nodes only. The node refuses other Hosts, cross-origin requests and
  # non-JSON POSTs (CSRF / DNS rebinding guard): the server names the node, drops Origin, sends JSON and the token.
  location ~ ^/node/(shopper-1|shopper-2)(/.*)?$ {
    set $node $1;
    set $rest $2;
    if ($rest = "") { set $rest /; }
    proxy_pass http://$node:8080$rest$is_args$args;
    proxy_set_header Host $node;
    proxy_set_header Origin "";
    proxy_set_header Authorization "Bearer lab";
    proxy_set_header Content-Type application/json;
  }

  location ~ \.map$ {
    return 404;
  }

  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    add_header Content-Security-Policy $csp always;
    try_files $uri =404;
  }

  location / {
    add_header Cache-Control "no-cache" always;
    add_header Content-Security-Policy $csp always;
    try_files $uri $uri/ /index.html;
  }
}
