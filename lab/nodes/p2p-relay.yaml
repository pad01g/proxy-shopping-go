role: relay
name: relay-p2p
network: ps-lab
mnemonic_file: /keys/relay-p2p.mnemonic
data_dir: /data
admin: {listen: "0.0.0.0:8080", token: "lab", hosts: [p2p-relay]}
tls: {extra_ca: /caddy-data/caddy/pki/authorities/local/root.crt}
nostr:
  relays: ["wss://relay-1.test", "wss://relay-2.test"]
  k: 2
  allow_private_relays: true
p2p:
  listen: ["/ip4/0.0.0.0/tcp/4001", "/ip4/0.0.0.0/tcp/4002/ws"]
  bootstrap: []
  relays: []
  reachability: public
# role relay ignores the coordinators: it passes on every valid event (bounded, per-peer quotas; spec §10)
trust:
  coordinators: ["6eac25bc912ab49582890fa47837d574e6d7932620d5410fcffec31a8f87d520", "23c66e3b8b09d6f242e501ddbff2e6a2c786b4d36a8bdffddb1299b4c5de13dd", "07da142f98ad9ede9b07a73f6481feaf5a710e92b8581798241f02ac333f9084"]
  nostr: true   # lab: trust and profiles also from the lab relays (spec §2.6, default false)
chain:
  btc: {network: signet, esplora: "https://esplora.test"}
  evm: {chain_id: 31337, rpc: "https://evm.test", deployments: /deployments/31337.json}
fx:
  sources:
    - {type: coingecko, base: "https://rates.test/coingecko"}
    - {type: frankfurter, base: "https://rates.test/frankfurter"}
