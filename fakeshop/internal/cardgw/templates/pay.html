<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CardGW – Pay {{.Session.Merchant}}</title>
<style>
body { font-family: system-ui, sans-serif; background: #f4f5f7; margin: 0; }
main { max-width: 420px; margin: 40px auto; background: #fff; padding: 24px; border-radius: 8px; box-shadow: 0 1px 4px #0002; }
label { display: block; margin-top: 12px; font-size: 14px; color: #444; }
input { width: 100%; box-sizing: border-box; padding: 8px; font-size: 16px; }
button { margin-top: 20px; width: 100%; padding: 10px; font-size: 16px; background: #3b5bdb; color: #fff; border: 0; border-radius: 4px; }
.error { color: #c92a2a; background: #fff5f5; padding: 8px; border-radius: 4px; }
.done { color: #2b8a3e; }
</style>
</head>
<body>
<main>
  <h1>CardGW</h1>
  <p>Merchant: <strong id="pay-merchant">{{.Session.Merchant}}</strong><br>
     Order: <span id="pay-order">{{.Session.OrderID}}</span></p>
  <p>Amount: <strong id="pay-amount" data-amount="{{.Session.Amount.Amount}}" data-currency="{{.Session.Amount.Currency}}">{{.Session.Amount.Display}}</strong></p>
  {{if .Paid}}
  <p class="done" id="pay-done">This session has already been paid.</p>
  {{else}}
  {{if .Error}}<p class="error" id="pay-error" data-reason="{{.Reason}}" data-charge="{{.Charge}}">{{.Error}}</p>{{end}}
  <form method="post" action="/pay/{{.Session.ID}}">
    <label for="card-number">Card number</label>
    <input id="card-number" name="number" inputmode="numeric" autocomplete="cc-number" value="{{.Card.Number}}" required>
    <label for="card-exp">Expiry (MM/YY)</label>
    <input id="card-exp" name="exp" autocomplete="cc-exp" value="{{.Card.Exp}}" required>
    <label for="card-cvc">CVC</label>
    <input id="card-cvc" name="cvc" inputmode="numeric" autocomplete="cc-csc" required>
    <label for="card-name">Name on card</label>
    <input id="card-name" name="name" autocomplete="cc-name" value="{{.Card.Name}}" required>
    <button id="pay" type="submit">Pay {{.Session.Amount.Display}}</button>
  </form>
  <p><small>Test cards: 4242 4242 4242 4242 succeeds, 4000 0000 0000 0002 is declined.</small></p>
  {{end}}
</main>
</body>
</html>
